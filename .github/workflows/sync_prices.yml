name: Sync prezzi CardTrader (manuale, solo espansioni recenti)

on:
  # Niente piu' cron automatico (sostituito da sync_prices_priority.yml,
  # vedi docs/binder_reserved_work_plan_2026-09-11.md punto 3): resta come
  # strumento manuale per un resync mirato delle espansioni recenti, es.
  # dopo aver aggiunto un campo nuovo da ripopolare (--force) senza aspettare
  # che ci arrivi il batch prioritario nel suo ordine naturale.
  workflow_dispatch:
    inputs:
      force:
        description: "Rifai il sync anche per le carte gia' aggiornate oggi (es. per ripopolare un campo nuovo dopo una modifica di schema)"
        type: boolean
        default: false

permissions:
  contents: read

# Condiviso con sync_catalog.yml, sync_prices_full.yml e
# sync_prices_priority.yml: mai due sync in scrittura sul database Postgres
# in parallelo.
concurrency:
  group: ct-tracker-db-write
  cancel-in-progress: false

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    # Solo le espansioni recenti (daily_expansion_codes in
    # config/tracked_sets.json, era Scarlet & Violet + Mega Evolution) per
    # restare in tempi ragionevoli. Timeout largo perche' il rate limit di 1
    # richiesta/secondo sul marketplace CardTrader e' il vero collo di
    # bottiglia (~10.000+ carte -> 170+ minuti minimo), non il DB.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Aggiorna prezzi (solo espansioni recenti)
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: python scripts/sync_prices.py --only-daily ${{ inputs.force && '--force' || '' }}
