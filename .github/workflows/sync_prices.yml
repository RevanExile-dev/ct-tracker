name: Sync prezzi CardTrader

on:
  schedule:
    # Ogni giorno alle 06:00 UTC (~08:00 in Italia in orario invernale, 07:00-08:00 estivo)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rifai il sync anche per le carte gia' aggiornate oggi (es. per ripopolare un campo nuovo dopo una modifica di schema)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    # Sync giornaliero: solo le espansioni recenti (daily_expansion_codes in
    # config/tracked_sets.json, era Scarlet & Violet + Mega Evolution) per
    # restare in tempi ragionevoli. Il sync completo gira una volta a
    # settimana da sync_prices_full.yml.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Configura identita' git per i checkpoint
        run: |
          git config user.name "ct-tracker-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Aggiorna prezzi (solo espansioni recenti)
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
        run: python scripts/sync_prices.py --only-daily ${{ inputs.force && '--force' || '' }}

      - name: Notifica Telegram (cali di prezzo e watchlist)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py
