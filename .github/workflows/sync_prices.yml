name: Sync prezzi CardTrader

on:
  schedule:
    # Ogni giorno alle 06:00 UTC (~08:00 in Italia in orario invernale, 07:00-08:00 estivo)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Aggiorna prezzi
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
        run: python scripts/sync_prices.py

      - name: Copia il DB per il sito Next.js
        run: |
          mkdir -p web/public/data
          cp data/cardtrader.db web/public/data/cardtrader.db

      - name: Commit e push
        run: |
          git config user.name "ct-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cardtrader.db web/public/data/cardtrader.db
          git diff --staged --quiet || git commit -m "chore: aggiornamento prezzi $(date -u +'%Y-%m-%d')"
          git push
