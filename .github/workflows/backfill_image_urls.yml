name: Backfill image_url (correggi URL immagine disallineati)

# Corregge image_url per i blueprint con URL sospetto ("(2).jpg" - versione
# obsoleta che l'export bulk di CardTrader non ha aggiornato dopo che il
# file e' stato rielaborato/rinominato sul loro storage, vedi
# scripts/backfill_image_urls.py). Manuale, non schedulato: non serve
# rilanciarlo di routine, solo quando si sospetta che altre carte siano
# entrate nello stesso stato.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mostra solo cosa cambierebbe, senza scrivere sul DB"
        type: boolean
        default: true

permissions:
  contents: read

# Scrive sullo stesso Postgres di sync_prices*/sync_catalog: stesso gruppo
# di concorrenza, mai due scritture in parallelo.
concurrency:
  group: ct-tracker-db-write
  cancel-in-progress: false

jobs:
  backfill-image-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Backfill
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        working-directory: scripts
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python backfill_image_urls.py --dry-run
          else
            python backfill_image_urls.py
          fi
