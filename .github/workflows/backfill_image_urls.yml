name: Backfill image_url (correggi URL immagine disallineati)

# Corregge image_url per i blueprint con URL sospetto ("(2).jpg" - versione
# obsoleta che l'export bulk di CardTrader non ha aggiornato dopo che il
# file e' stato rielaborato/rinominato sul loro storage, vedi
# scripts/backfill_image_urls.py). Non e' legato all'uscita di nuove
# espansioni: il disallineamento nasce quando CardTrader rielabora una foto
# gia' pubblicata, che puo' succedere mesi dopo su carte vecchie quanto
# nuove - per questo gira anche in automatico una volta a settimana
# (domenica 03:00 UTC, prima del sync catalogo delle 04:30), non solo a
# mano. Query leggera (pochi ms) quando non c'e' nulla da correggere.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mostra solo cosa cambierebbe, senza scrivere sul DB"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

# Scrive sullo stesso Postgres di sync_prices*/sync_catalog: stesso gruppo
# di concorrenza, mai due scritture in parallelo.
concurrency:
  group: ct-tracker-db-write
  cancel-in-progress: false

jobs:
  backfill-image-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Backfill
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        working-directory: scripts
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python backfill_image_urls.py --dry-run
          else
            python backfill_image_urls.py
          fi
