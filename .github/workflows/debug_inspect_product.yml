name: Debug - ispeziona prodotto marketplace

# Workflow diagnostico usa-e-getta (vedi scripts/debug_inspect_product.py):
# stampa nel log il JSON grezzo di un'inserzione per scoprire quali campi
# offre davvero l'API CardTrader oltre a quelli gia' letti dal codice.
on:
  workflow_dispatch:
    inputs:
      blueprint_id:
        description: "ID del blueprint da ispezionare (default: una carta con inserzioni live confermate)"
        type: string
        default: "256084"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Ispeziona prodotto
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
        run: python scripts/debug_inspect_product.py "${{ inputs.blueprint_id }}"
