name: UI smoke (responsive toolbar)

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ui_smoke.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  responsive-toolbar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # Il catalogo/prezzi vive su Postgres (non piu' nei due file .db
    # committati in git, rimossi dalla migrazione a Postgres): senza un
    # database vero qui ogni pagina/API tornerebbe vuota o in errore, e
    # questi test (che interagiscono con dropdown espansione/rarita' e con
    # carte cercabili via scanner) non avrebbero nulla su cui lavorare.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ct_tracker_ui_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/ct_tracker_ui_smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installa dipendenze
        run: npm ci

      - name: Installa Playwright solo per il test CI
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium

      - name: Schema + dati minimi di test su Postgres
        run: |
          psql "$POSTGRES_URL" -f db/schema.sql
          psql "$POSTGRES_URL" -f tests/fixtures/smoke-seed.sql

      - name: Build
        run: npm run build

      - name: Avvia server
        run: |
          npm run start -- -p 3000 > /tmp/ct-tracker-next.log 2>&1 &
          echo $! > /tmp/ct-tracker-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ct-tracker-next.log
          exit 1

      - name: Test responsive + mobile manual filters + scanner
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/mobile-toolbar.spec.mjs tests/mobile-filter-manual.spec.mjs tests/scanner.spec.mjs tests/binder-insights.spec.mjs tests/binder-quantity.spec.mjs --reporter=line

      - name: Log server in caso di errore
        if: failure()
        run: cat /tmp/ct-tracker-next.log || true
