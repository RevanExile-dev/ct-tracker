name: Debug - GitHub Models

# Workflow diagnostico usa-e-getta: verifica se GitHub Models e' davvero
# chiamabile con solo il GITHUB_TOKEN automatico (permesso "models: read"),
# senza nessun account/API key separata.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "ID del modello da provare (catalogo GitHub Models)"
        type: string
        default: "openai/gpt-4o-mini"

permissions:
  contents: read
  models: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Prova GitHub Models
        env:
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/debug_github_models.py "${{ inputs.model }}"
