name: CI (build frontend)

# Nessuna verifica automatica esisteva prima d'ora: un push che rompe la
# build veniva scoperto solo quando falliva il deploy su Vercel (o a mano).
# Gira solo quando cambia qualcosa sotto web/, non ad ogni sync prezzi
# (che tocca solo i DB, non il codice).
on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Installa dipendenze
        run: npm ci

      - name: Build (include il type-check di Next.js)
        run: npm run build
