name: Backfill rarita (carte senza rarita)

# Una tantum/manuale: riempie la rarita' mancante (~1.100 carte, soprattutto
# vecchie promo senza inserzioni) dal catalogo CardTrader, vedi
# scripts/backfill_rarity.py. Una chiamata API per espansione coinvolta.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mostra solo i numeri, senza scrivere sul DB"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ct-tracker-db-write
  cancel-in-progress: false

jobs:
  backfill-rarity:
    runs-on: ${{ vars.CT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Backfill
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        working-directory: scripts
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python backfill_rarity.py --dry-run
          else
            python backfill_rarity.py
          fi
