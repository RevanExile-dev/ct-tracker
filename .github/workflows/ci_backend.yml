name: CI (Python e config)

on:
  push:
    paths:
      - "scripts/**"
      - "config/**"
      - "web/config/top_artists.json"
      - ".github/workflows/sync_catalog.yml"
      - ".github/workflows/sync_cardmarket_prices.yml"
      - ".github/workflows/ci_backend.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "config/**"
      - "web/config/top_artists.json"
      - ".github/workflows/sync_catalog.yml"
      - ".github/workflows/sync_cardmarket_prices.yml"
      - ".github/workflows/ci_backend.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Postgres vero per il test di equivalenza della scrittura a blocchi
    # (scripts/test_db_price_batch.py): lo schema usa pg_trgm/unaccent e
    # ON CONFLICT, non simulabili in modo credibile con un finto database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ct_tracker_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Verifica sintassi Python
        run: python -m compileall -q scripts

      - name: Test scrittura prezzi a blocchi (db.write_price_batch, Postgres vero)
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/ct_tracker_backend_test
        run: python scripts/test_db_price_batch.py

      - name: Test ordine del catalogo per fascia di prezzo (db.fetch_priority_batch, Postgres vero)
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/ct_tracker_backend_test
        run: python scripts/test_db_priority_order.py

      - name: Verifica configurazioni JSON
        run: |
          python -m json.tool config/tracked_sets.json >/dev/null
          python -m json.tool config/watchlist.json >/dev/null
          python -m json.tool web/config/top_artists.json >/dev/null

      - name: Test incrocio artisti (sync_artists)
        run: python scripts/test_sync_artists.py

      - name: Test sync prezzi Cardmarket (sync_cardmarket_prices)
        run: python scripts/test_sync_cardmarket_prices.py

      - name: Test avvio catalogo notturno (dispatch_night_catalog)
        run: python scripts/test_dispatch_night_catalog.py

      - name: Test avvio sync Cardmarket (dispatch_cardmarket_sync)
        run: python scripts/test_dispatch_cardmarket_sync.py
