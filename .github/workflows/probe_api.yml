name: Esplora API CardTrader (diagnostica, sola lettura)

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Path dell'endpoint, es. /blueprints/406700"
        type: string
        required: true
      params:
        description: "Parametri query opzionali, formato chiave=valore separati da spazio"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esplora
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
        working-directory: scripts
        run: python probe_api.py "${{ inputs.path }}" ${{ inputs.params }}
