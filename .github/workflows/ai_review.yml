name: AI review (Gemini, secondo parere)

# Review indipendente e sola lettura: non modifica mai file, non commenta
# nulla in automatico, non blocca nessun push. Claude la lancia a mano
# (workflow_dispatch, chiamato via API) quando ritiene utile un secondo
# parere su una modifica rischiosa/significativa, poi legge il risultato
# dal log di questo job e decide come procedere. Vedi CLAUDE.md.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Cosa deve verificare la review (compito specifico, non generico)"
        type: string
        required: true
      base_ref:
        description: "Estremo iniziale del diff da rivedere (branch, tag o SHA)"
        type: string
        default: "HEAD~1"
      head_ref:
        description: "Estremo finale del diff da rivedere"
        type: string
        default: "HEAD"
      provider:
        description: "Quale AI usare per la review (auto = Gemini con fallback automatico a Groq se la quota e' esaurita)"
        type: choice
        options: ["auto", "gemini", "groq"]
        default: "auto"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # Backstop reale: scripts/ai_review.py ha gia' un timeout sulla chiamata
    # Gemini, ma un thread bloccato su una risposta di rete a scaglioni lenti
    # puo' tenere il processo Python vivo oltre quel timeout "morbido"
    # (visto in pratica: una chiamata rimasta appesa oltre 6 minuti). Questo
    # e' il tetto che garantisce davvero che il job non resti appeso.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # serve la storia intera per poter fare diff tra ref arbitrari

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Chiavi di riserva opzionali (es. da un altro account): usate
          # solo se quella sopra finisce la quota. Un secret non impostato
          # risulta in una stringa vuota, non un errore, quindi e' sicuro
          # lasciarle referenziate anche se non esistono ancora.
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
        run: python scripts/ai_review.py "${{ inputs.prompt }}" "${{ inputs.base_ref }}" "${{ inputs.head_ref }}" "${{ inputs.provider }}"
