name: Sync prezzi CardTrader (resto del catalogo)

on:
  schedule:
    # Resto del catalogo (~30.000 carte, tutte tranne le tracciate): 4 run
    # lunghi (~45 minuti ciascuno) di NOTTE, quando l'utente non compra
    # comunque carte, cosi' di giorno i giri frequenti delle carte tracciate
    # (sync_prices_priority.yml) non restano mai in coda dietro il catalogo.
    # Orari UTC: 00:30, 01:30, 02:30, 03:30 = 02:30-05:30 in ora legale
    # italiana (CEST, fino al 25/10/2026) e 01:30-04:30 in ora solare
    # (CET); l'ultimo run finisce entro le ~06:20 - sempre dentro la notte
    # italiana (finestra del passo sotto: 00:30-07:00 ora di Roma). Un'ora di distanza
    # (run di ~47 minuti) lascia ~13 minuti liberi tra uno e l'altro per un
    # giro delle tracciate. GitHub ritarda o salta i cron, anche di ore:
    # il passo "Finestra notturna" sotto fa uscire subito un run schedulato
    # che parte fuori dalla notte italiana, invece di bloccare il giorno.
    - cron: "30 0,1,2,3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Condiviso con sync_catalog.yml (e con sync_prices.yml/sync_prices_full.yml,
# rimasti solo per un resync manuale completo - vedi li'): mai due sync in
# scrittura sul database Postgres in parallelo. cancel-in-progress false: un
# run gia' partito non va ucciso, il prossimo aspetta in coda (con una
# cadenza di 6 ore, la coda non dovrebbe
# mai accumularsi in condizioni normali).
concurrency:
  group: ct-tracker-db-write
  cancel-in-progress: false

jobs:
  sync-prices-priority:
    runs-on: ${{ vars.CT_RUNNER || 'ubuntu-latest' }}
    # Il budget interno allo script (CATALOG_BUDGET_SECONDS, 45 minuti) e' controllato
    # SOLO tra una carta e la successiva, non dentro il retry/backoff di una
    # singola chiamata (api_client.py, max_retries=5, backoff 2^tentativo):
    # una carta puo' quindi da sola richiedere fino a 2+4+8+16+32=62s prima
    # di arrendersi. Il circuit breaker (MAX_CONSECUTIVE_ERRORS=15) nel caso
    # peggiore - 15 carte di fila che falliscono tutte al quinto tentativo,
    # es. durante un'interruzione di CardTrader, DOPO aver gia' usato quasi
    # tutto il budget di 45 minuti su carte riuscite prima nello stesso run -
    # puo' quindi richiedere fino a circa 45+15,5=60,5 minuti prima di
    # fermarsi (rilievo di review su questa PR, con margine ulteriore per un
    # eventuale timeout di rete su una singola richiesta): un valore ben piu'
    # ampio serve a lasciare al circuit breaker il tempo di attivarsi ed
    # uscire in modo pulito (messaggio d'errore chiaro + checkpoint scritto)
    # invece di essere ucciso a meta' da GitHub Actions con un timeout
    # generico che non lascerebbe nemmeno scrivere il checkpoint.
    timeout-minutes: 70
    steps:
      # Solo per i run schedulati (workflow_dispatch parte sempre): solo
      # tra le 00:30 e le 07:00 ora di Roma (Europe/Rome gestisce da solo
      # ora legale/solare). Fuori finestra i passi sotto vengono saltati.
      - name: Finestra notturna
        id: finestra
        run: |
          now=$(TZ=Europe/Rome date +%H%M)
          echo "Ora di Roma: $now (evento: ${{ github.event_name }})"
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$now" -lt 0030 ] || [ "$now" -ge 0700 ]; }; then
            echo "Fuori dalla notte italiana: salto questo run del catalogo."
            echo "esegui=no" >> "$GITHUB_OUTPUT"
          else
            echo "esegui=si" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.finestra.outputs.esegui == 'si'
        uses: actions/checkout@v4

      - if: steps.finestra.outputs.esegui == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        if: steps.finestra.outputs.esegui == 'si'
        run: pip install -r requirements.txt

      - name: Batch prioritario (allarmi -> desideri -> binder -> catalogo)
        if: steps.finestra.outputs.esegui == 'si'
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          # Facoltativo (sotto-parte 4c, allarmi prezzo): se assente lo
          # script salta solo l'invio, gli allarmi scattati restano in
          # coda (telegram_outbox) finche' non verra' impostato - stesso
          # interruttore "silenziosamente disattivato" di notify_telegram.yml.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/sync_prices_priority.py --catalog
