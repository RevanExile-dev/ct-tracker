name: Sync prezzi CardTrader (completo, settimanale)

on:
  schedule:
    # Ogni domenica alle 02:00 UTC. Sincronizza TUTTE le carte tracciate
    # (~30.000+), non solo quelle recenti: puo' richiedere diverse ore per
    # via del rate limit di 1 richiesta/secondo sul marketplace CardTrader.
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Rifai il sync anche per le carte gia' aggiornate oggi (es. per ripopolare un campo nuovo dopo una modifica di schema)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-prices-full:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Configura identita' git per i checkpoint
        run: |
          git config user.name "ct-tracker-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Aggiorna prezzi (tutte le espansioni tracciate)
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
        run: python scripts/sync_prices.py ${{ inputs.force && '--force' || '' }}

      - name: Notifica Telegram (cali di prezzo e watchlist)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py
