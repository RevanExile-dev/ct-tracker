name: Sync prezzi CardTrader (manuale, completo)

on:
  # Niente piu' cron automatico settimanale (sostituito da
  # sync_prices_priority.yml, vedi docs/binder_reserved_work_plan_2026-09-11.md
  # punto 3 - un sync completo su ~30.000+ carte al rate limit di 1
  # richiesta/secondo di CardTrader superava le 8 ore, vicino al tetto di 6
  # ore dei runner GitHub-hosted, bloccando per tutta la sua durata
  # qualunque altro sync nello stesso concurrency group): resta come
  # strumento manuale per un resync completo mirato, es. dopo aver aggiunto
  # un campo nuovo da ripopolare su TUTTO il catalogo (--force) senza
  # aspettare che il batch prioritario copra tutte le carte nel suo ordine
  # naturale.
  workflow_dispatch:
    inputs:
      force:
        description: "Rifai il sync anche per le carte gia' aggiornate oggi (es. per ripopolare un campo nuovo dopo una modifica di schema)"
        type: boolean
        default: false

permissions:
  contents: read

# Condiviso con sync_catalog.yml, sync_prices.yml e sync_prices_priority.yml:
# mai due sync in scrittura sul database Postgres in parallelo. Con un
# resync manuale completo che puo' durare ore, il batch prioritario
# accodato dietro aspetta invece di scrivere in contemporanea.
concurrency:
  group: ct-tracker-db-write
  cancel-in-progress: false

jobs:
  sync-prices-full:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Aggiorna prezzi (tutte le espansioni tracciate)
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: python scripts/sync_prices.py ${{ inputs.force && '--force' || '' }}
