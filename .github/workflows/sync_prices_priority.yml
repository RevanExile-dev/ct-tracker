name: Sync prezzi CardTrader (batch prioritario)

on:
  schedule:
    # Ogni 3 ore, a un minuto "dispari" (:17) invece che su multipli di 15:
    # il vecchio "*/15 * * * *" in pratica partiva solo 4-6 volte al giorno
    # (verificato sullo storico dei run, 2026-09-29..10-05: intervalli di
    # 3-7 ore tra un run e l'altro) perche' GitHub Actions scarta/ritarda i
    # cron molto frequenti, soprattutto sui minuti di punta (:00/:15/:30/:45).
    # Con run da ~4 minuti e ~5 giri al giorno si aggiornavano ~1000 carte/giorno
    # su ~30.000 (solo 5.749 con un prezzo degli ultimi 7 giorni). Ora ogni run
    # lavora molto di piu' (BUDGET_SECONDS ~50 minuti, ~3000 carte al rate limit
    # di 1 richiesta/secondo): anche se GitHub salta meta' dei giri, restano
    # >10.000 carte/giorno. Il repo e' pubblico (minuti Actions illimitati); il
    # vincolo reale e' il compute Neon free (100 CU-ore/mese, 0.25 CU): 8 run da
    # 50 min/giorno sono ~50 CU-ore/mese, restando sotto il tetto.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Condiviso con sync_catalog.yml (e con sync_prices.yml/sync_prices_full.yml,
# rimasti solo per un resync manuale completo - vedi li'): mai due sync in
# scrittura sul database Postgres in parallelo. cancel-in-progress false: un
# run gia' partito non va ucciso, il prossimo aspetta in coda (con una
# cadenza di 3 ore e un budget di 50 minuti per run, la coda non dovrebbe
# mai accumularsi in condizioni normali; i ~2 ore liberi tra un run e
# l'altro lasciano spazio a sync_catalog.yml e agli altri workflow dello
# stesso gruppo).
concurrency:
  group: ct-tracker-db-write
  cancel-in-progress: false

jobs:
  sync-prices-priority:
    runs-on: ubuntu-latest
    # Il budget interno allo script (BUDGET_SECONDS, 50 minuti) e' controllato
    # SOLO tra una carta e la successiva, non dentro il retry/backoff di una
    # singola chiamata (api_client.py, max_retries=5, backoff 2^tentativo):
    # una carta puo' quindi da sola richiedere fino a 2+4+8+16+32=62s prima
    # di arrendersi. Il circuit breaker (MAX_CONSECUTIVE_ERRORS=15) nel caso
    # peggiore - 15 carte di fila che falliscono tutte al quinto tentativo,
    # es. durante un'interruzione di CardTrader, DOPO aver gia' usato quasi
    # tutto il budget di 50 minuti su carte riuscite prima nello stesso run -
    # puo' quindi richiedere fino a circa 50+15,5=65,5 minuti prima di
    # fermarsi (rilievo di review su questa PR, con margine ulteriore per un
    # eventuale timeout di rete su una singola richiesta): un valore ben piu'
    # ampio serve a lasciare al circuit breaker il tempo di attivarsi ed
    # uscire in modo pulito (messaggio d'errore chiaro + checkpoint scritto)
    # invece di essere ucciso a meta' da GitHub Actions con un timeout
    # generico che non lascerebbe nemmeno scrivere il checkpoint.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Batch prioritario (allarmi -> desideri -> binder -> catalogo)
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          # Facoltativo (sotto-parte 4c, allarmi prezzo): se assente lo
          # script salta solo l'invio, gli allarmi scattati restano in
          # coda (telegram_outbox) finche' non verra' impostato - stesso
          # interruttore "silenziosamente disattivato" di notify_telegram.yml.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/sync_prices_priority.py
