name: Sync prezzi CardTrader (carte tracciate)

on:
  schedule:
    # Solo le carte TRACCIATE (allarmi armati, desideri, binder: ~200 carte
    # oggi, ~4 minuti di richieste a 1 req/s), ogni 30 minuti a minuti
    # "dispari" (:11/:41) invece di "*/15": il vecchio cron a 15 minuti
    # partiva in pratica solo 4-6 volte al giorno (storico run 29/09-05/10,
    # buchi di 3-7 ore) perche' GitHub scarta i cron molto frequenti,
    # soprattutto sui minuti di punta. Il resto del catalogo (~30.000 carte)
    # ha ora un workflow separato, lungo e raro: sync_prices_catalog.yml.
    - cron: "11,41 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # Serve solo al passo "Avvia il catalogo notturno" (gh workflow run).
  actions: write

# Condiviso con sync_catalog.yml (e con sync_prices.yml/sync_prices_full.yml,
# rimasti solo per un resync manuale completo - vedi li'): mai due sync in
# scrittura sul database Postgres in parallelo. cancel-in-progress false: un
# run gia' partito non va ucciso, il prossimo aspetta in coda (con una
# cadenza di 30 minuti e run brevi (tracciate) la coda non dovrebbe
# mai accumularsi in condizioni normali).
concurrency:
  group: ct-tracker-db-write
  cancel-in-progress: false

jobs:
  sync-prices-priority:
    runs-on: ${{ vars.CT_RUNNER || 'ubuntu-latest' }}
    # Il budget interno allo script (TRACKED_BUDGET_SECONDS, 10 minuti) e' controllato
    # SOLO tra una carta e la successiva, non dentro il retry/backoff di una
    # singola chiamata (api_client.py, max_retries=5, backoff 2^tentativo):
    # una carta puo' quindi da sola richiedere fino a 2+4+8+16+32=62s prima
    # di arrendersi. Il circuit breaker (MAX_CONSECUTIVE_ERRORS=15) nel caso
    # peggiore - 15 carte di fila che falliscono tutte al quinto tentativo,
    # es. durante un'interruzione di CardTrader, DOPO aver gia' usato quasi
    # tutto il budget di 10 minuti su carte riuscite prima nello stesso run -
    # puo' quindi richiedere fino a circa 10+15,5=25,5 minuti prima di
    # fermarsi (rilievo di review su questa PR, con margine ulteriore per un
    # eventuale timeout di rete su una singola richiesta): un valore ben piu'
    # ampio serve a lasciare al circuit breaker il tempo di attivarsi ed
    # uscire in modo pulito (messaggio d'errore chiaro + checkpoint scritto)
    # invece di essere ucciso a meta' da GitHub Actions con un timeout
    # generico che non lascerebbe nemmeno scrivere il checkpoint.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # I cron di GitHub per il catalogo (sync_prices_catalog.yml) vengono
      # spesso ritardati o saltati; questo workflow invece e' puntuale (ping
      # esterno ogni 30 minuti): di notte, in ora di Roma, e' lui ad avviare
      # il catalogo se non e' in corso e non ne sono gia' partiti 4. Prima del
      # sync, cosi' parte anche se il sync poi fallisce; il catalogo resta in
      # coda dietro questo giro (stesso gruppo di concorrenza).
      - name: Avvia il catalogo notturno (se serve)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dispatch_night_catalog.py

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Batch prioritario (allarmi -> desideri -> binder -> catalogo)
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          # Facoltativo (sotto-parte 4c, allarmi prezzo): se assente lo
          # script salta solo l'invio, gli allarmi scattati restano in
          # coda (telegram_outbox) finche' non verra' impostato - stesso
          # interruttore "silenziosamente disattivato" di notify_telegram.yml.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/sync_prices_priority.py --tracked
