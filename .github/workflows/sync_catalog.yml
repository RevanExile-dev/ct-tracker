name: Sync catalogo (carte tracciate)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "config/tracked_sets.json"
  schedule:
    # Controllo leggero giornaliero: in automatico vengono sincronizzate
    # soltanto le espansioni tracciate che non hanno ancora carte nel DB.
    # Cosi' i set aggiunti da CardTrader dopo il loro annuncio entrano nel
    # catalogo senza dover ricordare un lancio manuale e senza riscrivere
    # ogni giorno tutte le decine di migliaia di blueprint gia' presenti.
    - cron: "30 4 * * *"

permissions:
  contents: write

# Condiviso con sync_prices.yml e sync_prices_full.yml: scrivono tutti sugli
# stessi due DB e li pushano su main, quindi non devono mai girare insieme
# (rischio di commit persi/conflitti binari sui checkpoint). cancel-in-progress
# false: un run gia' partito non va ucciso, il prossimo aspetta in coda.
concurrency:
  group: ct-tracker-db-write
  cancel-in-progress: false

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Sincronizza catalogo
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/sync_catalog.py
          else
            python scripts/sync_catalog.py --only-missing
          fi

      - name: Copia i DB per il sito Next.js
        run: |
          mkdir -p web/public/data
          cp data/cardtrader.db web/public/data/cardtrader.db
          cp data/price_history.db web/public/data/price_history.db

      - name: Commit e push
        run: |
          git config user.name "ct-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cardtrader.db web/public/data/cardtrader.db data/price_history.db web/public/data/price_history.db
          git diff --staged --quiet || git commit -m "chore: sync catalogo $(date -u +'%Y-%m-%d')"
          git push
