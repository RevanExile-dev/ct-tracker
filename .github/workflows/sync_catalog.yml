name: Sync catalogo (carte tracciate)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Sincronizza catalogo
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
        run: python scripts/sync_catalog.py

      - name: Copia il DB per il sito Next.js
        run: |
          mkdir -p web/public/data
          cp data/cardtrader.db web/public/data/cardtrader.db

      - name: Commit e push
        run: |
          git config user.name "ct-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cardtrader.db web/public/data/cardtrader.db
          git diff --staged --quiet || git commit -m "chore: sync catalogo $(date -u +'%Y-%m-%d')"
          git push
