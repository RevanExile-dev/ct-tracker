name: TEMP PR review (Gemini + Groq)

# Ultimo passaggio temporaneo per questa PR. Le review catalogo/sync sono gia'
# state completate dopo le correzioni; qui teniamo solo il check finale dei due
# componenti UI modificati, abbastanza piccolo da rientrare nei limiti free-tier.
# Il file verra' rimosso prima del merge.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ai_review_pr_temp.yml"

permissions:
  contents: read

jobs:
  ui-groq:
    name: Groq - UI finale
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Review UI con Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          AI_REVIEW_PATHS: |
            web/components/FilterDropdown.tsx
            web/components/Toolbar.tsx
        run: >-
          python scripts/ai_review.py
          "Ultima review del fix responsive. Cerca solo bug concreti nei due componenti: clipping/overflow, controlli schiacciati, overlap del pulsante rimuovi espansione, touch target e regressioni tra telefono, tablet e desktop. Le prove browser Playwright sono gia' separate. Non modificare file; se non trovi problemi reali dillo chiaramente."
          origin/main HEAD groq

  ui-gemini:
    name: Gemini - UI finale
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Review UI con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          AI_REVIEW_PATHS: |
            web/components/FilterDropdown.tsx
            web/components/Toolbar.tsx
        run: >-
          python scripts/ai_review.py
          "Ultima review UX/UI del fix responsive. Cerca solo problemi concreti nei due componenti: clipping/overflow, gerarchia a 360-430px, tablet 768px, desktop 1366px, touch target e overlap del filtro espansione con la X. Le prove browser Playwright sono gia' separate. Non modificare file; se non trovi problemi reali dillo chiaramente."
          origin/main HEAD gemini
