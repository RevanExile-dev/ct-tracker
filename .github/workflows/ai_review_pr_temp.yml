name: TEMP PR review (Gemini + Groq)

# Workflow temporaneo per questa PR: il connettore GitHub della sessione non
# espone workflow_dispatch. Usa lo stesso reviewer e gli stessi secret gia'
# definiti dal progetto; verra' rimosso prima del merge.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ai_review_pr_temp.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Review tecnica Groq
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
        run: >-
          python scripts/ai_review.py
          "Review indipendente della PR mobile/catalogo. Controlla il diff completo rispetto a main. Cerca bug concreti, regressioni, overflow o layout tagliato a 360/390/430/768/1366px, problemi touch, altre istanze dello stesso pattern responsive non corrette, errori nei codici/date delle espansioni CardTrader occidentali recenti (Perfect Order, Chaos Rising, Pitch Black, 30th Celebration, Delta Reign), e problemi nella modalita' sync_catalog --only-missing / workflow concurrency / no-op. Non modificare file. Se non trovi problemi sostanziali, dillo esplicitamente; evita suggerimenti cosmetici generici."
          origin/main HEAD groq

      - name: Review finale Gemini (fallback Groq se quota esaurita)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
        run: >-
          python scripts/ai_review.py
          "Fai una review finale indipendente del diff completo della PR rispetto a main. Priorita': correttezza UX responsive e assenza di clipping/overflow sui filtri catalogo, compatibilita' desktop, correttezza dei set CardTrader aggiunti e delle date, sicurezza della sincronizzazione automatica dei soli set mancanti e assenza di regressioni sui DB/workflow. Cerca anche casi/stati analoghi che potrebbero essere stati dimenticati. Non modificare file. Riporta solo problemi concreti con severita' e motivo, oppure conferma che non ne vedi."
          origin/main HEAD auto
